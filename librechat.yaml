# Configuration version (required)
version: 1.2.5
 
# Cache settings: Set to true to enable caching
cache: true

interface:
  termsOfService:
    externalUrl: "https://example.com/terms"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "Terms of Service"
  mcpServers:
    placeholder: "MCP Servers"
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: false
  multiConvo: false
  agents: true
  customWelcome: "Hey {{user.name}}! Welcome to LibreChat"
  marketplace:
    use: false
  fileCitations: true
  fileSearch: true
  webSearch: false


memory:  # this is a bit weird, did not yet fully understand how this works
  disabled: false
  validKeys: ["user_preferences", "conversation_context", "personal_info"]
  tokenLimit: 2000
  personalize: true
  messageWindowSize: 5
  agent:
    provider: "llamacpp"
    model: "gpt-oss-120b"
    instructions: "You are a helpful assistant that remembers user preferences and context."
    model_parameters:
      temperature: 1.0
      max_tokens: 1000

fileConfig:
  endpoints:
#    agents:
#      fileLimit: 5
#      fileSizeLimit: 100  # Maximum size for an individual file in MB
#      totalSizeLimit: 500  # Maximum total size for all files in a single request in MB
    default:
      totalSizeLimit: 100
      supportedMimeTypes:
        - "image/.*"
        - "text/.*"
        - "application/pdf"
        - "video/.*"
        - "application/vnd.ms-excel"
        - "application/x-yaml"
#        - "audio/mp3"
#        - "audio/mpeg"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/msword"
    llamacpp:
      fileLimit: 5
      fileSizeLimit: 100
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
        - "text/markdown"
#        - "text/markdown"
  serverFileSizeLimit: 1000
  avatarSizeLimit: 2
  imageGeneration:
    percentage: 100
    px: 1024

endpoints:
  agents:
    # (optional) Default recursion depth for agents, defaults to 25
    recursionLimit: 50
    # (optional) Max recursion depth for agents, defaults to 25
    maxRecursionLimit: 100
    # (optional) Disable the builder interface for agents
    disableBuilder: false
    # (optional) Agent Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
    # capabilities: ["execute_code", "file_search", "actions", "tools", "artifacts", "ocr", "chain", "web_search"]
    capabilities: [ "file_search", "actions", "tools", "chain", "web_search"]
  custom:
    - name: "llamacpp"
      apiKey: "whatever"
      baseURL: "http://host.docker.internal:8080/v1" 
      models:
        default: [
          "gpt-oss-120b"
          ]
        fetch: false # fetching list of models is not supported
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "assistant"
      titleMethod: "completion"
      summaryMethod: "completion"
#shared:
#  titleMethod: "completion"
#  summaryMethod: "completion"
registration:
  socialLogins: []

webSearch:
  # Search Provider Configuration
  searxngInstanceUrl: "http://localhost:8888/"
  searxngApiKey: "no-op"
  searchProvider: "searxng" # Options: "serper", "searxng"


# Pin a single default model/preset so new chats just work
modelSpecs:
  list:
    - name: "local-llama"
      label: "Local Llama"
#      iconUrl: "/app/client/public/assets/openai.svg"
      default: true
      preset:
        endpoint: "llamacpp"     # must match the custom endpoint name above
        model: "gpt-oss-120b"
#        temperature: 1.0
#        top_p: 0.95
        maxContextTokens: 131072   # new: raise context budget
        max_tokens: 32768           # generation cap (separate from context)
    - name: "agents"
      label: "AI Agents"
      description: "Access specialized AI agents for complex tasks."
      showIconInMenu: true
      showIconInHeader: true
      preset:
        model: "gpt-oss-120b"
        default: true
        endpoint: "agents"
        max_tokens: 131072
#        temperature: 0.7
#        top_p: 0.95
        modelLabel: "SomethingXO"
        greeting: |
          Select an existing agent or create a new one using the `Agent Builder` in the menu on the right


# Example MCP Servers Object Structure
mcpServers:
  Filesystem:
    # type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /tmp
    iconPath: /home/user/LibreChat/client/public/assets/logo.svg
     The “wrench” icon shows up if no icon is provided as it is the default rendering.
  Cyberchef:
    type: streamable-http
    url: http://host.docker.internal:3002/mcp
  LLL:
    type: streamable-http
    url: http://host.docker.internal:3022/mcp
  "Tyche: PRNG Analysis (discover params for LCG, PCG, LSFR)":
    type: streamable-http
    url: http://host.docker.internal:3015/mcp
  "Chaos (Statistical Analysis of PRNGs)":
    type: streamable-http
    url: http://host.docker.internal:3016/mcp
  "Python (Code Executor)":
    type: streamable-http
    url: http://host.docker.internal:3003/mcp
  "Tartaros (Statistical Protocol Analysis)":
    type: streamable-http
    url: http://host.docker.internal:8765/mcp
    timeout: 120000
  "Wireshark (PCAP Analysis)":
    type: streamable-http
    url: http://host.docker.internal:3013/mcp
  "semgrep (Vuln Scanner)":
    type: streamable-http
    url: http://host.docker.internal:3011/mcp
